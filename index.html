<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>向日葵保卫战</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="game-shell">
<header><div class="brand"><span class="brand-flower">✿</span><div><h1>向日葵保卫战<span class="fuse-tip">✦ 任意两株植物可合体升级</span></h1><p>守住这一小片阳光。</p></div></div><nav><button id="sound">音效：开</button><button id="help">玩法说明</button><button id="pause">暂停</button><button id="restart">重开本关</button><button id="cheat">无敌模式</button><div class="diff"><label for="difficulty">僵尸强度</label><input type="range" id="difficulty" min="50" max="500" step="25" value="100"><b id="diff-value">×1</b></div></nav></header>
<section class="garden">
<div class="rack"><div class="sun-bank"><span>☀</span><strong id="sun">200</strong><small>可用阳光</small></div><div id="cards" class="cards"></div><div id="belt" class="belt" hidden></div><button id="shovel" class="shovel">♠<span>铲除</span><small>快捷键 S</small></button></div>
<div class="field-wrap"><canvas id="field" width="1100" height="650" tabindex="0" aria-label="五行九列战场；方向键选择格子，回车种植或收集阳光，数字键选择植物">请使用支持 Canvas 的浏览器。</canvas><div id="overlay" class="overlay"><div class="dialog"><span class="dialog-flower">✿</span><p id="eyebrow">一场发生在葵田里的小小战役</p><h2 id="dialog-title">阳光，由我们守护。</h2><p id="dialog-text"></p><div id="level-buttons"></div><button id="primary" class="primary">开始守护</button><button id="secondary" hidden>返回游戏</button></div></div><div id="cheat-dialog" class="overlay" hidden><div class="dialog"><span class="dialog-flower">✿</span><h2>开启无敌模式？</h2><p>阳光无限 · 卡牌无冷却 · 植物不受伤害</p><input id="cheat-password" type="password" placeholder="请输入密码" autocomplete="off"><p id="cheat-error" class="cheat-error"></p><div class="row"><button id="cheat-cancel">取消</button><button id="cheat-ok" class="primary">确认</button></div></div></div></div>
<footer><span id="status" role="status">选一株向日葵，让花园热闹起来。</span><span>1–6 选卡 · S 铲除 · 空格暂停</span></footer>
</section><p class="bottom-note">葵田手记　<span>先种暖阳葵积攒阳光，再让瓜子射手守住每一行。点击掉落的太阳收集阳光。</span><b>纯单机 / 无需联网</b></p>
</main><script src="waves.js"></script><script src="game.js"></script><script src="app.js"></script></body></html>
